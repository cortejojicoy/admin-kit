name: ci

# Tag-driven releases. `tool/version.py` owns the version scheme and git tags
# are the source of truth; `package.json` is a derived artifact synced from the
# tag before publishing.
#
# Trigger map:
#   push to main            → verify only
#   pull request to main    → verify only
#   push of a v*.*.* tag    → verify + publish
#
# There is deliberately no auto-bump-on-push job. It cannot coexist with
# tag-driven versioning: the tool computes a version from the tags, and a job
# that bumps `package.json` on every commit would immediately disagree with it.
# It is also how v0.1.8 reached the registry with no tag pointing at it.
#
# To release, from a clean main:
#   ./tool/release.sh minor          # or patch | major | alpha | beta | rc | lts | promote
#   ./tool/release.sh beta --dry-run # show what it would do
#
# Pre-releases publish under their own npm dist-tag (alpha/beta/rc/lts), so
# `npm install` keeps serving `latest`.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Verify — always runs. Gate for every other job.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (typecheck, lint, test, build, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The release tooling decides what version ships, so it is verified
      # before a tag can be cut rather than while one is being published.
      - name: Test the release tooling
        run: pnpm test:tool

      - name: Build
        run: pnpm build

      # Loads every entry point the way a consumer does, in ESM and CJS, and
      # asserts the "use client" directives are where they belong. v0.1.8
      # shipped an exports map pointing at files tsup never emitted and a
      # client bundle with its directive stripped — both typechecked cleanly.
      - name: Import smoke test
        run: pnpm smoke

      - name: Check package (publint + are-the-types-wrong)
        run: pnpm check:package

      - name: Pack preview (what will ship to npm)
        run: npm pack --dry-run

      # The real integration test. A Next build against the packaged output is
      # the only thing that catches duplicated React contexts across entry
      # points, a JSX runtime mismatch, or an edge-runtime API the bundle
      # cannot actually call.
      - name: Build the example app
        run: pnpm --filter @examples/app-router build

      - name: Check generated docs are current
        working-directory: examples/app-router
        run: node ../../dist/cli.js docs --out docs --check

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Publish — the only path to the registry. Fires when a v*.*.* tag is
  #    pushed, normally by tool/release.sh. Reads the version from the tag and
  #    publishes; commits nothing back.
  # ---------------------------------------------------------------------------
  publish-on-tag:
    name: publish (tag-triggered)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # `contents: write`, not read: creating the GitHub release is a write to
      # the repository. With `read` the publish succeeds and the release step
      # fails with "Resource not accessible by integration", which reads like a
      # token problem and is actually this line.
      contents: write
      id-token: write
    steps:
      # Full history and tags: `version.py notes` falls back to the commit log
      # between this tag and the previous one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # NOTE: deliberately no `registry-url`.
      #
      # `registry-url` makes setup-node write an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and export
      # NODE_AUTH_TOKEN as a placeholder. npm then sees configured (empty)
      # credentials, takes the classic-token path, and never attempts the OIDC
      # handshake — so the registry treats the publish as anonymous. An
      # unauthorised write to an *existing* package returns 404 rather than 403,
      # which is why this failed as "404 Not Found - PUT" with no hint that auth
      # was the problem. See npm/documentation#1960 and npm/cli#9088.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm may be
      # older. There is no NPM_TOKEN — the npm CLI mints a short-lived token
      # from GitHub's OIDC provider, which is what `id-token: write` grants.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Turn the next failure into a legible one. A misconfigured trusted
      # publisher reports itself as a 404 from the registry, so assert the
      # things we *can* see before getting there.
      - name: Preflight — credentials and versions
        run: |
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          echo "node $node_version / npm $npm_version"

          # npm >= 11.5.1 is required for the OIDC handshake.
          if [[ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -1)" != "11.5.1" ]]; then
            echo "::error::npm $npm_version is too old for trusted publishing (need >= 11.5.1)"
            exit 1
          fi

          # Any configured auth token sends npm down the classic path instead of
          # OIDC. There should be none.
          if npm config get //registry.npmjs.org/:_authToken 2>/dev/null | grep -qv '^undefined$'; then
            echo "::error::an npm auth token is configured; npm will skip the OIDC handshake"
            npm config list
            exit 1
          fi

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::no OIDC token endpoint — the job is missing 'id-token: write'"
            exit 1
          fi
          echo "OIDC token endpoint present; no auth token configured."

      # The tag is the source of truth. `sync` writes it into package.json;
      # `check` then refuses to go further if the two disagree or the tag does
      # not point at this commit.
      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! tool/version.py sync --tag "$TAG"; then
            echo "::error::'$TAG' is not a vX.Y.Z[-stage.N] release tag"
            exit 1
          fi
          {
            echo "version=${TAG#v}"
            echo "dist_tag=$(tool/version.py dist-tag --tag "$TAG")"
            echo "stage=$(tool/version.py stage)"
          } >> "$GITHUB_OUTPUT"

          # Release notes come from the CHANGELOG section for this version.
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            tool/version.py notes --tag "$TAG"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # A pre-release must not become `latest`, or `npm install` hands an alpha
      # to everyone. Each stage publishes on its own channel instead.
      # Skips a version already on the registry instead of failing, so re-running
      # a tag whose publish succeeded but whose later steps did not can finish
      # the job. npm refuses to republish a version, which would otherwise make
      # the run unrepeatable.
      - name: Publish to npm (trusted publishing + provenance)
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.version.outputs.version }}"

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published — skipping publish"
            exit 0
          fi

          if ! npm publish --access public --provenance --tag "${{ steps.version.outputs.dist_tag }}"; then
            cat >&2 <<'TXT'
          ::error::npm publish failed. A 404 on PUT means the registry rejected the
          credentials, not that the package is missing. With preflight green, the
          remaining cause is the registry side: npmjs.com -> the package -> Settings
          -> Trusted Publisher must name this exact repository and workflow file
          (cortejojicoy/admin-kit, ci.yml, environment blank).
          TXT
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.version.outputs.notes }}
          prerelease: ${{ steps.version.outputs.dist_tag != 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## ${{ github.ref_name }}"
            echo ""
            echo "- published \`@cortejojicoy/admin-kit@${{ steps.version.outputs.version }}\`"
            echo "- npm dist-tag: \`${{ steps.version.outputs.dist_tag }}\`"
            if [[ "${{ steps.version.outputs.dist_tag }}" != "latest" ]]; then
              echo "- pre-release: \`npm install @cortejojicoy/admin-kit@${{ steps.version.outputs.dist_tag }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
