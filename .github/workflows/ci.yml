name: ci

# Tag-driven releases. `tool/version.py` owns the version scheme and git tags
# are the source of truth; `package.json` is a derived artifact synced from the
# tag before publishing.
#
# Trigger map:
#   push to main            → verify only
#   pull request to main    → verify only
#   push of a v*.*.* tag    → verify + publish
#
# There is deliberately no auto-bump-on-push job. It cannot coexist with
# tag-driven versioning: the tool computes a version from the tags, and a job
# that bumps `package.json` on every commit would immediately disagree with it.
# It is also how v0.1.8 reached the registry with no tag pointing at it.
#
# To release, from a clean main:
#   ./tool/release.sh minor          # or patch | major | alpha | beta | rc | lts | promote
#   ./tool/release.sh beta --dry-run # show what it would do
#
# Pre-releases publish under their own npm dist-tag (alpha/beta/rc/lts), so
# `npm install` keeps serving `latest`.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Verify — always runs. Gate for every other job.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (typecheck, lint, test, build, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The release tooling decides what version ships, so it is verified
      # before a tag can be cut rather than while one is being published.
      - name: Test the release tooling
        run: pnpm test:tool

      - name: Build
        run: pnpm build

      # Loads every entry point the way a consumer does, in ESM and CJS, and
      # asserts the "use client" directives are where they belong. v0.1.8
      # shipped an exports map pointing at files tsup never emitted and a
      # client bundle with its directive stripped — both typechecked cleanly.
      - name: Import smoke test
        run: pnpm smoke

      - name: Check package (publint + are-the-types-wrong)
        run: pnpm check:package

      - name: Pack preview (what will ship to npm)
        run: npm pack --dry-run

      # The real integration test. A Next build against the packaged output is
      # the only thing that catches duplicated React contexts across entry
      # points, a JSX runtime mismatch, or an edge-runtime API the bundle
      # cannot actually call.
      - name: Build the example app
        run: pnpm --filter @examples/app-router build

      - name: Check generated docs are current
        working-directory: examples/app-router
        run: node ../../dist/cli.js docs --out docs --check

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Publish — the only path to the registry. Fires when a v*.*.* tag is
  #    pushed, normally by tool/release.sh. Reads the version from the tag and
  #    publishes; commits nothing back.
  # ---------------------------------------------------------------------------
  publish-on-tag:
    name: publish (tag-triggered)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history and tags: `version.py notes` falls back to the commit log
      # between this tag and the previous one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted Publishing needs npm >= 11.5.1. Node 20 ships with npm 10.x,
      # so upgrade before publishing. (Trusted Publishing has no NPM_TOKEN env;
      # the npm CLI mints a short-lived token via GitHub's OIDC provider.)
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      # The tag is the source of truth. `sync` writes it into package.json;
      # `check` then refuses to go further if the two disagree or the tag does
      # not point at this commit.
      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! tool/version.py sync --tag "$TAG"; then
            echo "::error::'$TAG' is not a vX.Y.Z[-stage.N] release tag"
            exit 1
          fi
          {
            echo "version=${TAG#v}"
            echo "dist_tag=$(tool/version.py dist-tag --tag "$TAG")"
            echo "stage=$(tool/version.py stage)"
          } >> "$GITHUB_OUTPUT"

          # Release notes come from the CHANGELOG section for this version.
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            tool/version.py notes --tag "$TAG"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # A pre-release must not become `latest`, or `npm install` hands an alpha
      # to everyone. Each stage publishes on its own channel instead.
      - name: Publish to npm (Trusted Publishing + provenance)
        run: npm publish --access public --provenance --tag "${{ steps.version.outputs.dist_tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.version.outputs.notes }}
          prerelease: ${{ steps.version.outputs.dist_tag != 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## ${{ github.ref_name }}"
            echo ""
            echo "- published \`@cortejojicoy/admin-kit@${{ steps.version.outputs.version }}\`"
            echo "- npm dist-tag: \`${{ steps.version.outputs.dist_tag }}\`"
            if [[ "${{ steps.version.outputs.dist_tag }}" != "latest" ]]; then
              echo "- pre-release: \`npm install @cortejojicoy/admin-kit@${{ steps.version.outputs.dist_tag }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
